version: 0.2

phases:
  install:
    commands:
      - echo Installing prerequisites...
      - yum update -y
      - yum install -y python3 python3-pip
      - pip3 install ansible
  pre_build:
    commands:
      - echo "[ec2_instances]" > $CODEBUILD_SRC_DIR/inventory
      - echo "YOUR_EC2_PUBLIC_IP ansible_user=ec2-user ansible_ssh_private_key_file=/root/.ssh/id_rsa" >> $CODEBUILD_SRC_DIR/inventory

  build:
    commands:
      - echo Running Ansible playbook to install CodeDeploy agent...
      - ansible-playbook -i inventory playbook.yml
